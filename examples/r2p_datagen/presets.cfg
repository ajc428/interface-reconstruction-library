# R2P-Net training data -- all families.
#
#   mpirun -np 24 r2p_datagen presets.cfg
#   r2p_datagen presets.cfg --selftest
#
# Lengths are in cells, angles in degrees, curvatures in 1/cells. Thickness ranges are
# set from the Film3D/Deformation3D audit (R2P cells: median ~0.4-0.6 cells).
# Distributions: fixed V | uniform A B | loguniform A B | normal M S | choice V1 V2 ...
# optionally prefixed with "signed" for a random sign (e.g. signed loguniform 0.0125 0.25);
# a bare number means fixed.
# Curvature is given as IRL paraboloid coefficients: surface h = -(a u^2 + b v^2) along
# the local normal, liquid below; a = 1/(2R) for radius of curvature R.
# Unknown keys are an error, so typos cannot silently fall back to defaults.

# ---------------------------------------------------------------- global ----
seed       = 1
output_dir = .
train      = 700000       # samples per split; 0 skips the split
val        = 150000
test       = 150000

stencil    = 3            # 3, or 5 to also write the raw 5^3 moments (moments5*.txt)

noise.sigma = 0.0125      # Gaussian noise on the centroids of mixed cells (cell units, clipped to +-0.5)
noise.mode  = independent # independent: both phases separately | consistent: gas centroid follows the liquid one

phase0         = pca      # phase fed to the network: pca (deployed r2pFlip rule) | film | vfsum.
                          # Films are always generated liquid; the rule is symmetric under swapping the
                          # phases, so gas films would only duplicate inputs. The summary's "flip" column
                          # is how often the rule picked the non-film phase (thick films).
label.format   = legacy   # legacy: 6 values, absent face = zeros (the deployed network's format)
                          # presence: 8 values, n1 n2 p1 p2 -- per-slot presence 1/0/-1(ignore), slot = side of the film
label.order    = xsign    # legacy only: xsign (first normal has positive x) | pca (first = closer to the PCA direction)
label.min_area = 1e-4     # legacy only: smaller face below this area (cell-face units) counts as absent
label.min_gap_fraction = 0.5  # > 0: in sheets / wedges / necks, rotate the two labels toward their mean
                                # normal until the planes they give (Newton distances, as deployed) are
                                # nowhere in the centre cell thinner than this fraction of the true film
                                # (unpinch.h); 0 (default) = plain centre-cell face averages
label.absent_area  = 0.01 # presence only: smaller face below this area is absent (p = 0) ...
label.present_area = 0.05 # ... at or above this present (p = 1), between: ignore (p = -1)
                          # (the largest face is always kept: a cut cell has at least one plane)

placement.band_fraction   = 0.7   # share with the surface offset uniform across the cell (more slivers);
                                  # the rest put the anchor point uniformly inside the cell
rotation.aligned_fraction = 0.0   # share rotated near a grid-aligned orientation (the rest: uniform)
rotation.jitter           = 10    # max deviation from that orientation

max_attempts = 1000       # draws per sample before giving up (reported)

viz.per_family = 5        # ParaView files (legacy VTK) for the first N samples of each family; 0 = off
viz.dir        = viz      # relative to output_dir
viz.resolution = 0.1      # triangle size of the surface output (cells)

# -------------------------------------------------------------- families ----
# kind = sheet   two faces about a mid-surface: thickness, a, b (mid-surface coefficients,
#                default 0 = flat; opposite signs = saddle), splay (opening angle between
#                the faces: a thinning wedge) or apex_distance (distance to where the faces
#                would meet, which sets splay = 2 atan(t/(2d)) for the drawn thickness),
#                flare (thickness curvature: thin middle, thickening sides)
# kind = tongue  a film ending in a rounded tip, x = -(a y^2 + b z^2): b > 0 sets the tip
#                (tip radius 1/(2b), thickness 2 sqrt(s/b) at distance s behind it), a bends
#                the edge line (a > 0 convex, like a disc rim); tip_distance = anchor
#                distance behind the tip
# kind = edge    two planes meeting in a sharp edge: opening, tip_distance
# kind = bulk    one resolved surface: a, b (default 0 = plane)
# kind = neck    a wedge that levels off into a thin film (rim -> bag): the faces
#                converge but do not meet. neck_thickness (the thinnest point),
#                vertex_distance (anchor to that point), opening (between the
#                faces at the anchor, deg), flare_split (share of the flare taken
#                by the upper face: 0 or 1 = one face flat), a, b (shared bending
#                of the mid-surface, as for a sheet)
#
# weight sets the share of each family (normalized over all families).

# [flat_thin]               # thinner than the cell's largest extent (sqrt 3): two faces can share
# kind      = sheet         # the centre cell, depending on orientation and placement
# weight    = 0.12
# thickness = loguniform 0.01 1.7320508

# [flat_thick]              # thicker than sqrt 3: never two faces in the centre cell (film -> resolved)
# kind      = sheet
# weight    = 0.08
# thickness = loguniform 1.7320508 4

[curved]                  # doubly curved, half of them saddles
kind      = sheet
weight    = 0.65
thickness = loguniform 0.02 4
a         = signed loguniform 0.005 0.1
b         = signed loguniform 0.005 0.1

# [curved_cyl]              # curved in one direction only
# kind      = sheet
# weight    = 0.08
# thickness = loguniform 0.01 1.5
# a         = signed loguniform 0.0125 0.25

[wedge]                   # thinning sheet, apex outside the stencil
kind      = sheet
weight    = 0.15
thickness     = loguniform 0.02 1.7320508
apex_distance = loguniform 3.5 10   # distance to where the faces would meet; splay = 2 atan(t/(2d))
                                    # (>= ~3.5 keeps the apex outside the 3^3 stencil; closer apexes are edges)
a         = signed loguniform 0.005 0.1
b         = signed loguniform 0.005 0.1

# [flare]                   # thin middle thickening outward: film -> junction-like transition
# kind      = sheet
# weight    = 0.07
# thickness = loguniform 0.01 0.8
# flare     = loguniform 0.05 1

# [rim]                     # rounded sheet end (lens edge / retracted rim), tip -> thick
# kind         = tongue
# weight       = 0.18
# b            = loguniform 0.25 10              # tip radius 0.05-2 cells
# a            = signed loguniform 0.0125 0.1667 # edge-line radius 3-40 cells
# tip_distance = uniform 0 3

[edge]                    # sharp edge
kind         = edge
weight       = 0.10
opening      = uniform 1 30
tip_distance = loguniform 0.01 3

[neck]                    # rim -> thin film transition: faces converge, then level off
kind            = neck
weight          = 0.1
neck_thickness  = loguniform 0.005 0.3
vertex_distance = uniform 0.5 2.5    # stencil edge is 1.5 cells from the centre
opening         = uniform 5 40
flare_split     = uniform 0 1
a               = signed loguniform 0.005 0.1
b               = signed loguniform 0.005 0.1

# [bulk]                    # resolved curved interface
# kind    = bulk
# weight  = 0.10
# a       = signed loguniform 0.0125 0.3333       # radii 1.5-40 cells
# b       = signed loguniform 0.0125 0.3333

# [plane]                   # resolved flat interface
# kind    = bulk
# weight  = 0.03
